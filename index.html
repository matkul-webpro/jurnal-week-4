<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="#home" class="logo">PC PARTS STORE</a>
        <ul class="nav-menu">
            <li>
                <a href="#home" class="nav-link">Home</a>
            </li>
            <li>
                <a href="#products" class="nav-link">Products</a>
            </li>
            <li>
                <a href="#about" class="nav-link">About</a>
            </li>
        </ul>
    </nav>

    <section id="home" class="hero-section">
        <div class="hero-content">
            <h1>Rakit Komputer <span class="highlight-text">Impianmu</span> Sekarang</h1>
        </div>
    </section>

    <section id="products" class="gallery-section">
        <h2 class="section-title">Kategori Komponen</h2>
        
        <div class="gallery-container">
            <div class="card">
                <img src="processor.png" alt="Processor" class="card-img">
                <div class="card-body">
                    <p>Processor</p>
                </div>
            </div>

            <div class="card">
                <img src="graphicCard.png" alt="Graphic Card" class="card-img">
                <div class="card-body">
                    <p>Graphic Card</p>
                </div>
            </div>

            <div class="card">
                <img src="ram.png" alt="RAM Memory" class="card-img">
                <div class="card-body">
                    <p>RAM Memory</p>
                </div>
            </div>

            <div class="card">
                <img src="ssd.png" alt="Storage SSD" class="card-img">
                <div class="card-body">
                    <p>Storage SSD</p>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="content-section">
        <h2>About Us</h2>
        <p>Kami menyediakan komponen PC berkualitas dengan garansi resmi dan harga terbaik untuk kebutuhan gaming, workstation, serta harian Anda.</p>
    </section>

</body>
</html>
